
url: https://ntriples.dataobservatory.eu/

template:
  bootstrap: 5
  bslib:
    base_font: {google: "Roboto"}
    heading_font: {google: "Roboto Slab"}
    code_font: {google: "JetBrains Mono"}

home:
  links:
    - text: "Data Observatory"
      href: https://dataobservatory.eu/
    - text: "dataset R package"
      href: https://dataset.dataobservatory.eu/

authors:
  Daniel Antal:
    href: https://reprex.nl/authors/daniel_antal/
  Reprex:
    href: https://reprex.nl/
    html: <img src="https://reprex.nl/authors/admin/avatar_hud66277e7f64fbf44513e7a4881e2a94f_35557_270x270_fill_lanczos_center_2.png"
      height="24" />

articles:
  - title: "Getting started"
    desc: >
      Introduction to RDF N-Triples serialization in R,
      using the Orange dataset to demonstrate interoperable
      metadata, authorship, and provenance.
    contents:
      - intro

reference:
  - title: "N-Triples serialization"
    desc: >
      Construct RDF statements and collect them into
      a set of unique N-Triples.
    contents:
      - n_triples
      - n_triple

  - title: "RDF terms and identifiers"
    desc: >
      Serialize R values as RDF terms and validate
      Internationalized Resource Identifiers (IRIs).
    contents:
      - rdf_term
      - iri

  - title: "Provenance"
    desc: >
      Describe authors and contributors as RDF agents
      using PROV-O or FOAF.
    contents:
      - person_triples
